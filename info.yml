# Metadata defining the behaviour and requirements for this engine

# expected fields in the configuration file for this engine
configuration:

  # A list of all the specified write nodes
  categories:
    type: list
    description: "A list of all the categories configurered."
    allows_empty: True
    values:
      type: dict
      items:
        category_name:
          type: str
        write_nodes:
          type: list
          values:
            type: dict
            items:
              name:
                type: str
              file_type:
                type: str
              settings:
                type: dict
              render_template:
                type: template
                fields: context, version, SEQ, [channel], [output], [name], [width], [height], [eye], [YYYY], [MM], [DD], *
              publish_template:
                type: template
                fields: context, version, SEQ, [channel], [output], [name], [width], [height], [eye], *
              tile_color:
                type: int


  template_script_work:
    type: template
    description: "Template for the Nuke script to get fields from."
    fields: context, version, [name], *

  default_category:
    type: str
    description: "Default category to select in the write node creation panel."
    default_value: prerender

  main_category_name:
    type: str
    description: "Main category to use for output of the Nuke script"
    default_value: main

  main_write_name:
    type: str
    description: "Name to use for the output of the Nuke script"
    default_value: main

  # ---- MayurWorks fork ----

  follow_script_version:
    type: bool
    description: "Keep the render path of every ShotGrid write node on the current script version through version-ups and save-as. Only the file path moves, and only while it is still the path the pipeline wrote - a path edited by hand is left alone. Never creates a node."
    default_value: true

  auto_read_after_render:
    type: bool
    description: "After a local render of an image sequence, create - or update - a Read node named render_<output> next to the write node."
    default_value: false


# this tk_nuke_writenode works in all engines - it does not contain
# any host application specific commands
supported_engines: [tk-nuke]

# the Shotgun fields that this engine needs in order to operate correctly
requires_shotgun_fields:

# More verbose description of this item
display_name: "ShotGrid Nuke Write Node"
description: "Support for the ShotGrid Write Node in Nuke."

# Required minimum versions for this item to run
requires_shotgun_version:
requires_core_version: "v0.14.28"
requires_engine_version:

# the frameworks required to run this tk_nuke_writenode
frameworks:
